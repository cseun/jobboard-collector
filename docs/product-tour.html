<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>채용보드 · 핵심 기능</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#172447;background:#f2f5ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.shell{max-width:1500px;margin:auto;padding:clamp(16px,3vw,44px)}header{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:24px}header small{color:#4f6cf0;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.04em;margin:8px 0}header p,.foot{color:#62718d;line-height:1.6;margin:0}header a{color:#3d59d8;font-weight:700;text-decoration:none;white-space:nowrap}.stage{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.55fr);gap:22px}.story,.shot{min-width:0;border:1px solid #e3e9fb;border-radius:24px;background:white;box-shadow:0 16px 45px #3c58a318}.story{min-height:550px;padding:clamp(24px,3vw,42px);display:flex;flex-direction:column}.num{color:#4f6cf0;font-size:.88rem;font-weight:800;letter-spacing:.09em}h2{font-size:clamp(2rem,3.3vw,3.2rem);letter-spacing:-.05em;line-height:1.15;margin:16px 0}.path{align-self:start;background:#eaf0ff;color:#3c55cb;padding:8px 13px;border-radius:99px;font-size:.85rem;font-weight:800}.lead{font-size:clamp(1.07rem,1.4vw,1.28rem);font-weight:650;line-height:1.6;margin:28px 0}.detail{display:grid;gap:14px;margin-top:auto}.detail div{border-top:1px solid #e8ecf7;padding-top:14px}.detail dt{color:#657392;font-size:.75rem;font-weight:850;letter-spacing:.09em;margin-bottom:5px}.detail dd{margin:0;line-height:1.55;color:#263657}.shot{background:linear-gradient(145deg,#e8eeff,#f7f9ff);display:grid;place-items:start center;min-height:550px;padding:clamp(12px,2.5vw,32px)}.shot img{display:block;width:100%;height:auto;max-height:min(72vh,660px);object-fit:contain;border-radius:12px;box-shadow:0 14px 38px #374e9224}.under{display:flex;align-items:center;gap:10px;margin:20px 0 15px}.under button,.pick button{border:1px solid #cbd6f7;background:white;border-radius:12px;color:#3a53c4;font-weight:800;padding:10px 15px}.under button:focus-visible,.pick button:focus-visible{outline:3px solid #aec0ff;outline-offset:2px}.under button:disabled{opacity:.4;cursor:default}#next{background:#536ef3;color:white;border-color:#536ef3}.count{margin-left:auto;color:#536487;font-weight:800}.rail{height:5px;background:#dce5ff;border-radius:99px;overflow:hidden;margin-bottom:18px}.rail span{display:block;height:100%;background:#536ef3;transition:width .2s}.pick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}.pick button{flex:none;color:#52607d;border-color:#dce4f8}.pick button[aria-current=step]{background:#e9eeff;border-color:#536ef3;color:#314ec8}.foot{font-size:.82rem;margin-top:10px}@media(max-width:850px){.stage{grid-template-columns:1fr}.story,.shot{min-height:0}}@media(max-width:550px){.shell{padding:18px 12px}.story{padding:24px}.shot{padding:12px}header a{font-size:.8rem}}
</style>
</head>
<body><main class="shell">
<header><div><small>JOBBOARD / PRODUCT TOUR</small><h1>공고 발견부터 면접 준비까지</h1><p>채용보드의 주요 화면을 한 장씩 살펴보세요.</p></div><a href="../README.md">README ↗</a></header>
<div class="under"><button id="previous" type="button">← 이전</button><button id="next" type="button">다음 →</button><span class="count" id="counter"></span></div><div class="rail" aria-hidden="true"><span id="progress"></span></div>
<div class="stage" aria-live="polite"><section class="story"><span class="num" id="chapter"></span><h2 id="title"></h2><span class="path" id="path"></span><p class="lead" id="lead"></p><dl class="detail"><div><dt>왜 필요한가</dt><dd id="problem"></dd></div><div><dt>어떻게 쓰나</dt><dd id="action"></dd></div><div><dt>남는 것</dt><dd id="result"></dd></div></dl></section><div class="shot"><img id="screen" alt="" loading="eager"></div></div>
<nav class="pick" id="slides" aria-label="화면 선택"></nav><p class="foot">← → 방향키로 이동할 수 있습니다. 공고 수·날짜·진행률은 촬영 시점의 예시입니다. 실제 지원은 해당 채용 사이트에서 진행합니다.</p>
</main><script>
const slides=[
{title:'한눈에 보는 준비',path:'홈 › 대시보드',image:'feature-dashboard.png',lead:'오늘 무엇을 해야 하는지와 전체 준비 상태를 한 화면에서 봅니다.',problem:'공고 탐색, 자기 이해, 서류, 면접 준비가 흩어지면 다음 행동을 놓치기 쉽습니다.',action:'진행률과 이번 주 계획, 다음 할 일, 마감 현황을 확인합니다.',result:'우선할 작업을 고르고 오늘 할 일로 이어갑니다.'},
{title:'나를 기준으로 만들기',path:'나 › 나 알아가기 · 내 정보 · 내 기준',image:'feature-self.png',lead:'경험과 선호를 기록해 공고를 판단할 나만의 기준을 만듭니다.',problem:'가진 기술과 원하는 조건이 정리되지 않으면 공고마다 같은 고민을 반복합니다.',action:'좋았던 경험과 강점·가치관을 적고, 내 정보와 내 기준에서 경력·기술·희망 조건을 채웁니다.',result:'공고 추천과 준비에 사용할 개인 기준이 생깁니다.'},
{title:'공고를 빠르게 좁히기',path:'공고 › 국내 공고',image:'feature-jobs.png',lead:'여러 조건을 조합하고 관심·보류·숨김을 표시하며 공고를 추립니다.',problem:'채용 사이트를 오가며 비슷한 공고와 이미 본 공고를 반복해서 확인하게 됩니다.',action:'직무·경력·지역·회사·적합도 등으로 필터링하고 원문과 표시 상태를 확인합니다.',result:'검토할 후보와 판단 이유를 남깁니다.'},
{title:'회사를 함께 비교하기',path:'회사 › 회사 비교',image:'feature-compare.png',lead:'공고만 보지 않고 회사의 특성과 후기를 나란히 살핍니다.',problem:'직무가 같아도 회사 문화·복지·면접 경험이 달라 지원 우선순위가 달라집니다.',action:'회사별 평점, 추천율, 복지, 문화, 면접 난이도와 마감 정보를 비교합니다.',result:'지원 순서를 정하고 더 확인할 회사를 고릅니다.'},
{title:'요건을 내 경험에 연결',path:'매니저 › 공고별 준비',image:'feature-posting.png',lead:'공고의 요구사항을 내 프로젝트와 경험에 하나씩 연결합니다.',problem:'공고의 필수·우대 조건을 읽어도 무엇을 근거로 보여줄지 막막할 수 있습니다.',action:'요건마다 경험과 근거 상태를 기록하고 다음 행동을 적습니다.',result:'서류·면접·프로젝트 준비로 이어지는 공고별 계획이 남습니다.'},
{title:'지원할 서류 준비',path:'준비 › 서류 준비 · 지원서 입력',image:'feature-documents.png',lead:'기본 자료를 재사용하면서 공고에 맞는 서류를 준비합니다.',problem:'같은 프로필을 반복 입력하고 공고별 수정 지점을 놓치기 쉽습니다.',action:'관심 공고의 마감과 조건을 보고 서류 자료, 지원서 입력 정보, 준비 공간을 엽니다.',result:'어느 공고에 무엇을 제출할지 정리합니다.'},
{title:'답변을 실제로 연습',path:'준비 › 모의면접',image:'feature-interview.png',lead:'질문을 읽고 끝내는 대신 제한 시간 안에 말로 답해 봅니다.',problem:'예상 질문을 알아도 실제 면접에서는 말의 순서와 시간이 흔들릴 수 있습니다.',action:'회사를 고르고 질문 듣기·답변 타이머·음성 입력·기록을 사용합니다.',result:'답변 기록과 다시 연습할 질문을 확인합니다.'},
{title:'다음 행동을 놓치지 않기',path:'홈 › 오늘 할 일',image:'feature-today.png',lead:'지원 준비를 하루 단위 행동으로 바꾸고 완료를 기록합니다.',problem:'마감과 준비 과제가 쌓이면 우선순위가 흐려집니다.',action:'오늘 할 일을 체크하고 반복 일정과 제안된 작업을 관리합니다.',result:'실행 기록이 남고 다음 날의 작업으로 이어집니다.'}
];
const $=id=>document.getElementById(id),nav=$('slides');let index=Math.max(0,Math.min(slides.length-1,Number(new URLSearchParams(location.search).get('slide'))-1||0));
slides.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String(i+1).padStart(2,'0')+' '+s.title;b.onclick=()=>show(i);nav.append(b)});
function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];$('chapter').textContent='FEATURE '+String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');for(const k of ['title','path','lead','problem','action','result'])$(k).textContent=s[k];$('screen').src='tour-images/'+s.image;$('screen').alt=s.path+'의 주요 기능 화면';$('counter').textContent=(index+1)+' / '+slides.length;$('progress').style.width=((index+1)/slides.length*100)+'%';$('previous').disabled=index===0;$('next').disabled=index===slides.length-1;[...nav.children].forEach((b,p)=>p===index?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));try{history.replaceState(null,'','?slide='+(index+1))}catch{}}
$('previous').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(index);
</script></body></html>
