<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>채용보드 · 직접 체험하기</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#1d2949;background:#e9eeff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;min-height:100vh;gap:18px;padding:18px;max-width:1660px;margin:auto}.side,.guide,.top,.card,.hero,.job,.table-wrap{background:#fff;border:1px solid #e1e8fb;border-radius:20px;box-shadow:0 8px 28px #4260ab11}.side{padding:18px 12px;position:sticky;top:18px;height:calc(100vh - 36px);overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:4px 9px 22px}.logo{background:#5875f6;color:white;border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-weight:900}.brand b{font-size:.98rem}.brand small{display:block;color:#8b98b2;font-size:.75rem}.nav-label{font-size:.68rem;color:#9aa6be;font-weight:800;letter-spacing:.13em;padding:13px 12px 7px}.side button{width:100%;text-align:left;border:0;background:transparent;color:#4b5a7a;border-radius:12px;padding:11px 12px;margin:2px 0;font-weight:650}.side button[aria-current=page]{background:#5a77f5;color:white;box-shadow:0 6px 16px #5875f655}.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;margin-bottom:18px}.top h1{margin:0;font-size:1.1rem}.badge{background:#edf1ff;color:#4964de;font-weight:750;border-radius:999px;padding:6px 11px;font-size:.78rem}.muted{color:#7d8aa6}.content{max-width:1100px;margin:auto}.hero{padding:25px 28px;margin-bottom:16px;background:linear-gradient(120deg,#fff,#eef2ff)}.hero small{color:#5873ed;font-weight:850;letter-spacing:.12em}.hero h2{margin:8px 0 7px;font-size:clamp(1.4rem,2.5vw,2rem);letter-spacing:-.035em}.hero p{margin:0;color:#64718e;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:20px}.card h3{font-size:.95rem;margin:0 0 11px}.big{font-size:1.85rem;font-weight:850;color:#5571ed}.card p{line-height:1.55;margin:8px 0;color:#687792}.button,.outline{border-radius:10px;padding:9px 13px;font-weight:750;border:1px solid #5a77f5}.button{background:#5a77f5;color:white}.outline{background:white;color:#4c65d8}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}.toolbar input,.toolbar select{background:#fff;border:1px solid #dce4f8;border-radius:11px;padding:10px 12px;color:#283657}.toolbar input{flex:1;min-width:200px}.job{padding:17px 20px;margin-bottom:11px}.job h3{font-size:1.05rem;margin:4px 0}.job p{color:#64718e;margin:4px 0 10px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.76rem;background:#eef2ff;color:#4b63cb;border-radius:999px;padding:5px 9px}.star{font-size:1.4rem;border:0;background:transparent;color:#b9c4dd}.star[aria-pressed=true]{color:#e6a71d}.guide{padding:20px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}.guide small{color:#5b73ed;font-weight:850;letter-spacing:.09em}.guide h2{font-size:1.4rem;line-height:1.3;margin:13px 0}.guide p{line-height:1.65;color:#566582}.guide .steps{margin-top:auto}.guide .steps p{font-size:.83rem}.guide button{border:1px solid #ccd7f6;background:#fff;color:#455fcf;border-radius:10px;padding:9px 12px;font-weight:750}.guide #guideNext{background:#5875f6;color:#fff;border-color:#5875f6}.guide button:disabled{opacity:.4;cursor:default}.spotlight{position:relative;z-index:1;outline:3px solid #627cff;outline-offset:4px;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px #657cf822}}.table-wrap{overflow:auto}.table-wrap table{border-collapse:collapse;width:100%;min-width:650px}.table-wrap th,.table-wrap td{text-align:left;padding:14px 16px;border-bottom:1px solid #e9edfa}.table-wrap th{color:#7b88a3;font-size:.78rem}.table-wrap tr:last-child td{border-bottom:0}.req{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e4eafb;background:#fff;border-radius:12px;padding:15px;margin:9px 0}.req b{display:block}.req span{color:#7987a1;font-size:.84rem}.req select{border:1px solid #d6e0f6;border-radius:9px;padding:8px;background:#fff}.todo{display:flex;gap:12px;align-items:center;border-bottom:1px solid #e7ecf8;padding:14px 0}.todo:last-child{border:0}.todo input{width:19px;height:19px;accent-color:#5a77f5}.todo.done span{text-decoration:line-through;color:#9ba6bd}.callout{background:#f0f4ff;border-radius:12px;padding:14px;color:#4f6081;line-height:1.55;margin-top:16px}.empty{padding:30px;text-align:center;color:#7a88a1}.footer{font-size:.78rem;color:#7886a1;margin:22px 4px}.guide-controls{display:flex;gap:8px}.guide-controls button{flex:1}@media(max-width:1200px){.app{grid-template-columns:185px minmax(0,1fr)}.guide{position:static;height:auto;grid-column:2}.guide .steps{margin-top:16px}}@media(max-width:720px){.app{display:block;padding:10px}.side{height:auto;position:static;margin-bottom:10px}.side nav{display:flex;overflow:auto}.side button{width:auto;white-space:nowrap}.nav-label{display:none}.brand{padding-bottom:8px}.top{padding:14px}.grid{grid-template-columns:1fr}.guide{margin-top:12px}.req{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><span class="logo">R3</span><span><b>채용보드 체험</b><small>예시 데이터 전용</small></span></div><nav aria-label="체험 메뉴"><div class="nav-label">탐색</div><button data-page="home">🏠 대시보드</button><button data-page="jobs">🔍 공고 탐색</button><button data-page="compare">🏢 회사 비교</button><div class="nav-label">준비</div><button data-page="prep">🧭 공고별 준비</button><button data-page="today">✅ 오늘 할 일</button></nav></aside>
<main class="main"><div class="top"><h1 id="pageTitle"></h1><span class="badge">체험용 · 저장되지 않음</span></div><div class="content" id="content"></div><p class="footer">이 페이지의 회사·공고·평점은 모두 가상의 예시입니다. 서버 API, 계정, 실제 채용공고와 연결되지 않습니다.</p></main>
<aside class="guide" aria-label="화면 안내"><small>INTERACTIVE GUIDE</small><h2 id="guideTitle"></h2><p id="guideBody"></p><div class="callout" id="guideTip"></div><div class="steps"><p id="guideCount"></p><div class="guide-controls"><button id="guidePrev">← 이전</button><button id="guideNext">다음 →</button></div><button id="guideRestart" style="width:100%;margin-top:9px">처음부터 보기</button></div></aside>
</div>
<script>
const jobs=[
 {id:1,co:'가온로보틱스',role:'로봇 소프트웨어 개발자',region:'경기',skill:'ROS · Python · C++',match:82,deadline:'D-12',why:'로봇 제어 프로젝트 경험과 관련',requirements:['ROS 기반 로봇 개발','Python 또는 C++ 개발','센서 데이터 처리']},
 {id:2,co:'모아랩',role:'AI 비전 엔지니어',region:'서울',skill:'Python · Computer Vision',match:76,deadline:'D-19',why:'비전 프로젝트와 기술이 맞음',requirements:['Python 모델 개발','영상 처리 경험','모델 배포 경험']},
 {id:3,co:'한빛자동화',role:'PLC 제어 개발자',region:'인천',skill:'PLC · HMI · 제어',match:68,deadline:'D-7',why:'설비 제어 경험을 연결할 수 있음',requirements:['PLC 제어 경험','HMI 화면 설계','현장 시운전']},
 {id:4,co:'이음AI',role:'LLM 서비스 개발자',region:'서울',skill:'Python · RAG · API',match:73,deadline:'D-24',why:'AI 서비스 프로젝트를 설명할 수 있음',requirements:['LLM API 연동','RAG 파이프라인','서비스 운영']}
];
const companies=[
 {co:'가온로보틱스',field:'로봇',score:'4.2',culture:'4.0',interview:'3.1'},
 {co:'모아랩',field:'AI 비전',score:'4.0',culture:'4.3',interview:'3.4'},
 {co:'한빛자동화',field:'자동화',score:'3.7',culture:'3.6',interview:'2.9'},
 {co:'이음AI',field:'AI 서비스',score:'4.1',culture:'4.2',interview:'3.3'}
];
const state={page:'home',q:'',region:'전체 지역',starred:new Set(),selected:new Set(['가온로보틱스','모아랩']),jobId:1,req:{},done:new Set(),guide:0};
const guide=[
 {page:'home',target:'#summary',title:'전체 준비 상태',body:'대시보드에서 관심 공고와 오늘 할 일을 먼저 확인합니다.',tip:'아래 숫자는 이 체험 페이지의 가상 데이터로만 계산됩니다.'},
 {page:'jobs',target:'#filters',title:'공고 필터',body:'검색어와 지역을 바꾸면 보이는 공고가 바로 달라집니다.',tip:'예: “Python”을 입력하거나 서울을 선택해 보세요.'},
 {page:'jobs',target:'#firstJob',title:'관심 공고 선택',body:'별을 눌러 관심 공고로 표시하고 “공고별 준비”로 넘어갈 수 있습니다.',tip:'실제 보드에서도 관심 표시와 준비 기록은 공고를 따라 이어집니다.'},
 {page:'compare',target:'#comparison',title:'회사 비교',body:'회사를 선택하면 평점·문화·면접 난이도를 같은 표에서 비교합니다.',tip:'점수는 체험을 위한 가상 값이며 실제 회사 정보가 아닙니다.'},
 {page:'prep',target:'#requirements',title:'요건과 내 경험 연결',body:'공고의 각 요건에 근거가 있는지 고르고 부족한 부분을 표시합니다.',tip:'“보완 필요”를 고르면 다음 행동을 정하는 근거가 됩니다.'},
 {page:'today',target:'#tasks',title:'실행으로 옮기기',body:'준비 작업을 체크해 보세요. 완료 수가 대시보드에도 반영됩니다.',tip:'체험 데이터는 새로고침하면 초기화됩니다.'}
];
const tasks=['관심 공고 2개 비교하기','공고 요건에 맞는 프로젝트 근거 적기','1분 자기소개 말해보기','지원 서류 최종 확인'];
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(k,t,d){return '<section class="hero"><small>'+k+'</small><h2>'+t+'</h2><p>'+d+'</p></section>'}
function home(){return head('OVERVIEW','오늘의 채용 준비','공고를 찾은 다음 무엇을 할지까지 한눈에 확인합니다.')+'<div class="grid" id="summary"><div class="card"><h3>⭐ 관심 공고</h3><div class="big">'+state.starred.size+'</div><p>표시해 둔 공고</p><button class="outline" data-page="jobs">공고 살펴보기 →</button></div><div class="card"><h3>✅ 완료한 일</h3><div class="big">'+state.done.size+' / '+tasks.length+'</div><p>오늘 준비한 작업</p><button class="outline" data-page="today">오늘 할 일 →</button></div><div class="card"><h3>🎯 공고별 준비</h3><div class="big">'+Object.keys(state.req).length+'</div><p>확인한 요구사항</p><button class="outline" data-page="prep">준비 공간 →</button></div></div><div class="card" style="margin-top:14px"><h3>이 보드의 흐름</h3><p>공고 찾기 → 회사 비교 → 요구사항과 내 경험 연결 → 서류·면접 준비 → 실행 기록</p></div>'}
function jobsView(){const rows=jobs.filter(j=>(state.region==='전체 지역'||j.region===state.region)&&(!state.q||[j.co,j.role,j.skill].join(' ').toLowerCase().includes(state.q.toLowerCase())));return head('DISCOVER','나에게 맞는 공고 찾기','조건을 바꾸고 관심 공고를 골라 보세요.')+'<div class="toolbar" id="filters"><input id="search" aria-label="기업·직무·기술 검색" placeholder="기업·직무·기술 검색" value="'+escapeHtml(state.q)+'"><select id="region" aria-label="지역 선택">'+['전체 지역','서울','경기','인천'].map(v=>'<option '+(v===state.region?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="outline" id="clearFilters">초기화</button></div><div id="jobList">'+(rows.length?rows.map((j,i)=>'<article class="job" '+(i===0?'id="firstJob"':'')+'><div class="row between"><div><b>'+j.co+'</b><h3>'+j.role+'</h3></div><button class="star" data-star="'+j.id+'" aria-label="'+j.co+' 관심 공고 '+(state.starred.has(j.id)?'해제':'설정')+'" aria-pressed="'+state.starred.has(j.id)+'">'+(state.starred.has(j.id)?'★':'☆')+'</button></div><p>'+j.region+' · '+j.skill+' · 마감 '+j.deadline+'</p><div class="tags"><span class="tag">적합도 '+j.match+'%</span><span class="tag">'+j.why+'</span></div><div class="row" style="margin-top:14px"><button class="button" data-prep="'+j.id+'">공고별 준비 →</button></div></article>').join(''):'<div class="card empty">조건에 맞는 가상 공고가 없습니다.</div>')+'</div>'}
function compare(){return head('COMPARE','회사 비교','관심 있는 회사를 선택하고 같은 기준으로 비교합니다.')+'<div class="card" style="margin-bottom:14px"><h3>비교할 회사</h3><div class="row">'+companies.map(c=>'<label><input type="checkbox" data-company="'+c.co+'" '+(state.selected.has(c.co)?'checked':'')+'> '+c.co+'</label>').join('　')+'</div></div><div class="table-wrap" id="comparison"><table><thead><tr><th>회사</th><th>분야</th><th>평점</th><th>문화</th><th>면접 난이도</th></tr></thead><tbody>'+companies.filter(c=>state.selected.has(c.co)).map(c=>'<tr><td><b>'+c.co+'</b></td><td>'+c.field+'</td><td>'+c.score+'</td><td>'+c.culture+'</td><td>'+c.interview+'</td></tr>').join('')+'</tbody></table>'+(!state.selected.size?'<div class="empty">비교할 회사를 선택해 주세요.</div>':'')+'</div><div class="callout">숫자는 가상 예시입니다. 실제 보드에서는 수집된 회사 정보와 후기의 출처를 확인해야 합니다.</div>'}
function prep(){const job=jobs.find(j=>j.id===state.jobId)||jobs[0];return head('PREPARE','공고 요건 ↔ 내 경험','한 공고의 요구사항을 내 경험과 연결해 봅니다.')+'<div class="toolbar"><select id="prepJob" aria-label="준비할 공고">'+jobs.map(j=>'<option value="'+j.id+'" '+(j.id===job.id?'selected':'')+'>'+j.co+' · '+j.role+'</option>').join('')+'</select></div><div class="card" id="requirements"><h3>'+job.co+' · '+job.role+'</h3><p>각 요건을 확인하고 근거 상태를 고르세요.</p>'+job.requirements.map((r,i)=>'<div class="req"><div><b>'+r+'</b><span>'+(i===0?'필수 요건':'우대 또는 관련 요건')+'</span></div><select data-req="'+job.id+':'+i+'" aria-label="'+r+' 근거 상태">'+['미확인','근거 있음','보완 필요','경험 없음'].map(v=>'<option '+((state.req[job.id+':'+i]||'미확인')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')+'</div><div class="callout">근거가 있는 요건은 서류와 면접에서 어떤 프로젝트로 증명할지 적고, 보완할 요건은 오늘 할 일로 옮기는 흐름입니다.</div>'}
function today(){return head('ACTION','오늘 할 일','탐색과 분석을 오늘 실행할 작업으로 바꿉니다.')+'<div class="card" id="tasks"><h3>오늘의 준비 · '+state.done.size+'/'+tasks.length+' 완료</h3>'+tasks.map((t,i)=>'<label class="todo '+(state.done.has(i)?'done':'')+'"><input type="checkbox" data-task="'+i+'" '+(state.done.has(i)?'checked':'')+'><span>'+t+'</span></label>').join('')+'</div><div class="callout">실제 보드에는 반복 일정, 제안된 할 일, 날짜별 기록도 있습니다. 여기서는 체크 동작만 체험합니다.</div>'}
const views={home,jobs:jobsView,compare,prep,today},titles={home:'대시보드',jobs:'국내 공고',compare:'회사 비교',prep:'공고별 준비',today:'오늘 할 일'};
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false'));$('pageTitle').textContent=titles[state.page];$('content').innerHTML=views[state.page]();guideRender()}
function guideRender(){const s=guide[state.guide];$('guideTitle').textContent=s.title;$('guideBody').textContent=s.body;$('guideTip').textContent=s.tip;$('guideCount').textContent=(state.guide+1)+' / '+guide.length+' 단계';$('guidePrev').disabled=state.guide===0;$('guideNext').disabled=state.guide===guide.length-1;document.querySelectorAll('.spotlight').forEach(x=>x.classList.remove('spotlight'));if(state.page===s.page){const el=document.querySelector(s.target);if(el)el.classList.add('spotlight')}}
function step(n){state.guide=Math.max(0,Math.min(guide.length-1,n));state.page=guide[state.guide].page;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();return}const star=e.target.closest('[data-star]');if(star){const id=Number(star.dataset.star);state.starred.has(id)?state.starred.delete(id):state.starred.add(id);render();return}const p=e.target.closest('[data-prep]');if(p){state.jobId=Number(p.dataset.prep);state.page='prep';render();return}if(e.target.id==='clearFilters'){state.q='';state.region='전체 지역';render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.q=e.target.value;const caret=e.target.selectionStart;render();const box=$('search');box.focus();box.setSelectionRange(caret,caret)}});
document.addEventListener('change',e=>{if(e.target.id==='region'){state.region=e.target.value;render()}if(e.target.id==='prepJob'){state.jobId=Number(e.target.value);render()}if(e.target.dataset.company){e.target.checked?state.selected.add(e.target.dataset.company):state.selected.delete(e.target.dataset.company);render()}if(e.target.dataset.req){state.req[e.target.dataset.req]=e.target.value;render()}if(e.target.dataset.task){const n=Number(e.target.dataset.task);e.target.checked?state.done.add(n):state.done.delete(n);render()}});
$('guidePrev').onclick=()=>step(state.guide-1);$('guideNext').onclick=()=>step(state.guide+1);$('guideRestart').onclick=()=>step(0);render();
</script>
</body></html>
