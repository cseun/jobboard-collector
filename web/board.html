<title>채용 보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 레이아웃: 한 줄 피드. 위에 붙는 탭 머리, 구간별로 묶인 카드, 넓은 화면에서도 760px 한 단 */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5d6a79;
  --line: #d9dfe7;
  --accent: #1d5bbf;
  --accent-soft: #e4ecfa;
  --hot: #c43a2f;
  --hot-soft: #fbe7e4;
  --warn: #9a6512;
  --warn-soft: #f8edd6;
  --ok: #2c7a4b;
  --ok-soft: #e1f2e8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #161d25; --ink: #e5eaf0; --muted: #94a1b0; --line: #29333f;
    --accent: #7aa7ff; --accent-soft: #1b2a44; --hot: #ff8073; --hot-soft: #3a1f1c;
    --warn: #e6b456; --warn-soft: #362a14; --ok: #66c792; --ok-soft: #16301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161d25; --ink: #e5eaf0; --muted: #94a1b0; --line: #29333f;
  --accent: #7aa7ff; --accent-soft: #1b2a44; --hot: #ff8073; --hot-soft: #3a1f1c;
  --warn: #e6b456; --warn-soft: #362a14; --ok: #66c792; --ok-soft: #16301f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 14px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.stamp { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 8px 9px 10px; border-bottom: 2px solid transparent; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .n { font-family: var(--font-data); font-size: 12px; margin-left: 4px; color: var(--muted); }

main .wrap { padding-block: 16px 48px; display: grid; gap: 18px; }
.lead { margin: 0; color: var(--muted); font-size: 14px; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.summary b { display: block; font-family: var(--font-data); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.summary span { font-size: 12px; color: var(--muted); }
.summary .hot b { color: var(--hot); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type="search"] { flex: 1 1 180px; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.filters select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip-toggle { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--muted); padding: 7px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.group { display: grid; gap: 8px; }
.group h2 { margin: 6px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; display: flex; gap: 8px; align-items: baseline; }
.group h2 .n { font-family: var(--font-data); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.card summary.solo { grid-template-columns: minmax(0, 1fr); }
.card summary::-webkit-details-marker { display: none; }
.dday { font-family: var(--font-data); font-weight: 600; font-size: 15px; text-align: center; border-radius: 8px; padding: 6px 0 4px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.2; }
.dday small { display: block; font-size: 11px; font-weight: 500; margin-top: 2px; }
.dday.hot { background: var(--hot-soft); color: var(--hot); }
.dday.warn { background: var(--warn-soft); color: var(--warn); }
.dday.past { text-decoration: line-through; }
.head { min-width: 0; display: grid; gap: 4px; }
.co { font-weight: 700; font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.role { color: var(--ink); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.why { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.why b { color: var(--ink); font-weight: 500; }
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.high { background: var(--ok-soft); color: var(--ok); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--hot-soft); color: var(--hot); }
.doc-hint { margin: 2px 0 6px; font-size: 12px; color: var(--muted); line-height: 1.8; }
.doc-empty { border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 13px; }
.doc-chk { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.doc-chk table td { vertical-align: top; line-height: 1.9; }
.body { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-block: 12px 14px; margin: 0 14px; }
.body dl { margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; }
.body dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
.card .source-text { border-top: 1px solid var(--line); padding-top: 8px; }
.card .source-text summary { display: block; padding: 6px 0; color: var(--muted); font-size: 13px; }
.source-body { max-height: 360px; overflow: auto; padding: 10px; border-radius: 8px; background: var(--bg); overflow-wrap: anywhere; }
.body dd { margin: 0; overflow-wrap: anywhere; }
.body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.body h3 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a, .links button { display: inline-block; text-decoration: none; font: inherit; font-weight: 500; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
.links a + a, .links .ghost { background: var(--accent-soft); color: var(--accent); }

.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.row .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { color: var(--muted); text-align: center; padding: 32px 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.copy { font: inherit; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; white-space: nowrap; }
.copy.done { color: var(--ok); border-color: var(--ok); }
.kv { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 14px; }
.kv dt { color: var(--muted); font-size: 12px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.body dl.kv { grid-template-columns: 88px minmax(0, 1fr) auto; align-items: start; } .kv > div { align-self: start; }
@media (max-width: 640px) { .kv, .body dl.kv { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; } .kv dt { grid-column: 1 / -1; margin-top: 8px; } }
.letter { background: var(--bg); border-radius: 10px; }
.letter summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; font-weight: 500; }
.letter summary::-webkit-details-marker { display: none; }
.letter .text { padding: 0 12px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; display: grid; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .card[open] .body { animation: open .18s ease-out; } @keyframes open { from { opacity: .4; transform: translateY(-3px); } } }
/* 모의면접 */
.mk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mk-bar label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.mk-bar select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.mk-btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
.mk-btn:hover { border-color: var(--accent); }

.mk-btn:focus-visible, .mk-bar select:focus-visible, .mk-ta:focus-visible, .mk-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mk-card { padding: 16px; display: grid; gap: 10px; min-width: 0; }
.mk-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mk-id { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.mk-q { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.45; text-wrap: balance; }
.mk-timer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mk-clock { font-family: var(--font-data); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
.mk-track { flex: 1 1 160px; height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.mk-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.mk-fill.ans { background: var(--warn); }
.mk-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mk-lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.mk-ta { width: 100%; min-height: 120px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.mk-noai { margin: 0; font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; }
.mk-key { border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; }
.mk-key ul, .mk-cols ul { margin: 4px 0 0; padding-left: 18px; }
.mk-verdict { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mk-big { font-size: 14px; font-weight: 700; padding: 3px 12px; }
.mk-pts { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
.mk-pts li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px; }
.mk-pts .ok { color: var(--ok); } .mk-pts .no { color: var(--hot); }
.mk-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; font-size: 14px; }
@media (max-width: 560px) { .mk-cols { grid-template-columns: minmax(0, 1fr); } }
.mk-cols h3, .mk-rw h3 { margin: 0; font-size: 12px; color: var(--muted); }
.mk-warn { margin: 0; font-size: 13px; background: var(--hot-soft); color: var(--hot); border-radius: 8px; padding: 6px 10px; }
.mk-rw { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
.mk-fu { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.mk-fuq { margin: 0; font-weight: 700; }
.mk-bubble { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; margin-top: 8px; }
.mk-list { display: grid; gap: 4px; }
.mk-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.mk-item.on { border-color: var(--accent); background: var(--accent-soft); }
.mk-t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.hot, .pill.hot-p { background: var(--hot-soft); color: var(--hot); }
.pill.aero { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.iv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.iv h3 { font-size: 15px; margin: 18px 0 8px; }
.iv h4 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.iv-legend p { margin: 0 0 6px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.iv-legend summary { font-size: 13px; color: var(--muted); cursor: pointer; display: block; padding: 0; }
.iv-top { margin: 0; padding-left: 22px; font-size: 14px; line-height: 1.7; }
.iv-top b { color: var(--hot); font-size: 12px; margin-left: 4px; }
.iv-f { margin: 4px 0 4px; }
.iq-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.iq { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface); }
.iq[data-t~="aero"] { border-left: 3px solid var(--accent); }
.iq-q { font-size: 14px; font-weight: 500; line-height: 1.5; }
.iq-b { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.iq-b:empty { display: none; }
.iq-s { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.iq-c { font-size: 13px; margin-top: 5px; padding: 6px 8px; border-radius: 8px; background: var(--accent-soft); line-height: 1.5; }
.pill.lv-n { background: var(--ok-soft); color: var(--ok); }
.pill.lv-c { background: var(--warn-soft); color: var(--warn); }
.pill.lv-q { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); }
.iv[data-f="lv-n"] .iq:not([data-t~="lv-n"]), .iv[data-f="lv-q"] .iq:not([data-t~="lv-q"]), .iv[data-f="lv-c"] .iq:not([data-t~="lv-c"]),
.iv[data-f="lv-n"] .iq-g:not(:has(.iq[data-t~="lv-n"])), .iv[data-f="lv-q"] .iq-g:not(:has(.iq[data-t~="lv-q"])), .iv[data-f="lv-c"] .iq-g:not(:has(.iq[data-t~="lv-c"])),
.iv[data-f="aero"] .iq:not([data-t~="aero"]), .iv[data-f="dup"] .iq:not([data-t~="dup"]), .iv[data-f="conv"] .iq:not([data-t~="conv"]) { display: none; }
.iv[data-f="aero"] .iq-g:not(:has(.iq[data-t~="aero"])), .iv[data-f="dup"] .iq-g:not(:has(.iq[data-t~="dup"])), .iv[data-f="conv"] .iq-g:not(:has(.iq[data-t~="conv"])) { display: none; }
@media (prefers-reduced-motion: reduce) { .mk-fill { transition: none; } }
.eyes{position:sticky;top:var(--eyetop,0px);z-index:4;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;margin:0 0 10px;width:100%;border-radius:0 0 12px 12px;box-shadow:0 4px 10px rgba(0,0,0,.06);background:var(--bg);border-bottom:1px solid var(--line)}
.eyes[hidden]{display:none!important}
.eyes .eye-cap{font-size:12px;color:var(--muted)}
.eye-blink{transform-box:fill-box;transform-origin:center;animation:eyeblink 5s infinite}
@keyframes eyeblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@media (prefers-reduced-motion: reduce){.eye-blink{animation:none}}
.mk-refs { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
.mk-refs details { border-bottom: 1px solid var(--line); }
.mk-refs details:last-child { border-bottom: 0; }
.mk-refs summary { cursor: pointer; padding: 10px 2px; font-weight: 600; font-size: 14px; }
.mk-refs .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.mk-refs .refbody { padding: 2px 4px 14px; font-size: 14px; line-height: 1.65; }

.mk-refs .pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.mk-refs .pcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.mk-refs .pcard h4 { margin: 0 0 6px; }
.mk-refs .pcard dl, .mk-refs .nums { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.mk-refs dt { font-weight: 700; color: var(--muted); } .mk-refs dd { margin: 0; overflow-wrap: anywhere; }


/* 공고 필터: 기본 줄 + 상세 필터 */
.f-more { font-weight: 700; } .f-more .f-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; margin-left: 2px; }
.f-adv { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 10px; }
.f-sort { justify-content: space-between; align-items: center; } .f-sort select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
/* 적합도 한 묶음 */
.fitbox, .xr-in { display: grid; gap: 6px; background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.xr-in { background: var(--surface); border: 1px solid var(--line); margin: 6px 0 0; }

/* ===== 대시보드 테마 (밝은 라벤더 배경 · 흰 둥근 카드 · 블루/시안 강조) ===== */
:root {
  --bg: #eef1fb; --surface: #ffffff; --ink: #1f2440; --muted: #7d849c; --line: #e6e9f4;
  --accent: #4c6ef5; --accent-2: #22c3e6; --accent-soft: #edf0ff; --grad: linear-gradient(135deg, #4c6ef5 0%, #6c8cff 100%);
  --hot: #e5484d; --hot-soft: #fdecec; --warn: #b7791f; --warn-soft: #fdf3e1; --ok: #20a46b; --ok-soft: #e3f6ec;
  --page: linear-gradient(140deg, #d9e0f6 0%, #e9edfa 38%, #f4f5fb 100%);
  --sh: 0 10px 30px rgba(76, 110, 245, .08), 0 2px 6px rgba(31, 36, 64, .04); --r: 18px;
  --lv: #ecebff; --pk: #ffeee6; --cy: #e3f8fc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --surface: #171e33; --ink: #e7eaf6; --muted: #929ab5; --line: #262f4a;
    --accent: #7b93ff; --accent-2: #4fd6f0; --accent-soft: #212b4d; --grad: linear-gradient(135deg, #5b76ff 0%, #7f9bff 100%);
    --hot: #ff7b7f; --hot-soft: #3a1d24; --warn: #f0b95b; --warn-soft: #382c16; --ok: #5fd39b; --ok-soft: #15321f;
    --page: linear-gradient(140deg, #0c1120 0%, #121a30 50%, #0f1424 100%); --sh: 0 10px 30px rgba(0, 0, 0, .35); --lv: #262a52; --pk: #3a2a24; --cy: #16343c;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #171e33; --ink: #e7eaf6; --muted: #929ab5; --line: #262f4a;
  --accent: #7b93ff; --accent-2: #4fd6f0; --accent-soft: #212b4d; --grad: linear-gradient(135deg, #5b76ff 0%, #7f9bff 100%);
  --hot: #ff7b7f; --hot-soft: #3a1d24; --warn: #f0b95b; --warn-soft: #382c16; --ok: #5fd39b; --ok-soft: #15321f;
  --page: linear-gradient(140deg, #0c1120 0%, #121a30 50%, #0f1424 100%); --sh: 0 10px 30px rgba(0, 0, 0, .35); --lv: #262a52; --pk: #3a2a24; --cy: #16343c;
}
body { background: var(--page) fixed, var(--bg); }
body::before { background: transparent; }
header.top { background: transparent; border-bottom: 0; padding-top: 10px; }

.brand { align-items: center; }

.acct-btn { border: 0; box-shadow: 0 3px 10px rgba(76, 110, 245, .18); }
nav.groups { gap: 4px; justify-content: flex-start; }
nav.groups button { border: 0; background: transparent; border-radius: 14px; padding: 6px 12px 7px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; min-width: 64px; }
nav.groups button i { font-style: normal; font-size: 20px; line-height: 1.1; filter: grayscale(.9) opacity(.65); transition: filter .15s; }
nav.groups button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
nav.groups button[aria-current="true"] i { filter: none; }
nav.groups button[aria-current="true"]::after { content: ""; position: absolute; top: 5px; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--hot); }
nav.groups .n { position: absolute; top: 2px; right: 4px; font-size: 10px; background: var(--hot); color: #fff; border-radius: 999px; padding: 0 5px; opacity: 1; margin: 0; }
nav.groups .n { display: none; }
nav.tabs { border-top: 1px solid var(--line); margin-inline: -18px; padding-inline: 14px; }

.card, .row, .scroll, .summary div { border: 0; border-radius: var(--r); box-shadow: var(--sh); }
.card summary { padding: 14px 16px; }
.row { padding: 14px 16px; }
.summary div { padding: 12px 14px; }
.summary b { color: var(--ink); }
