services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports를 열지 않습니다. DB는 같은 Docker 네트워크의 api에서만 접근합니다.

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FILES_DIR: /srv/files
      PRIVATE_DIR: /srv/private
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}   # 사용자 API 키를 암호화하는 마스터 키(없으면 AI 기능이 꺼짐)
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-300}
    volumes:
      - files:/srv/files            # 업로드한 서류(백업 대상)
      - ./private:/srv/private:ro   # 관리자에게만 내려가는 비공개 보드 코드(저장소에 올리지 마세요)
    # 이것도 ports를 열지 않습니다. 바깥에서는 caddy를 통해서만 들어옵니다.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
